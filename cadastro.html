<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Cadastro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="container">
    <div class="conteudo">
  <form id="form-cadastro">
    <label for="nome">Nome</label>
    <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required="required">
    
    <br><br>
    
    <label for="email">E-mail</label>
    <input type="email" id="email" name="email" placeholder="exemplo@dominio.com" required="required">
    
    <br><br>
    
    <label for="senha">Senha</label>
    <input type="password" id="senha" name="senha" required="required">
    
    <br><br>
    
    <button type="submit">Enviar</button>
  </form>
  
  <p id="senha-pequena" style="color: red;"></p>
  
 <p id="realizado" style="color: green;"></p>
 
 <div class="botao">
<a href="Index.html">
    <button>Voltar</button>
  </a>
  </div>
  </div>
</div>
<script src="cadastro.js"></script>
</body>
</html>
